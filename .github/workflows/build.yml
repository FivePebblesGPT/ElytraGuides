name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace 2>&1 | tee build.log

      - name: Persist build diagnostics
        if: failure() && github.event_name == 'push'
        run: |
          tail -n 300 build.log > ci-build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-error.txt
          git commit -m "CI build diagnostics [skip ci]"
          git push

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ElytraGuides
          path: build/libs/*.jar
